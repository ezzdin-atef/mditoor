name: Release Windows app

on:
  release:
    types: [published]

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Check out the released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read and validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag '$env:RELEASE_TAG' must use the format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
          }

          $version = $Matches.version
          @{ version = $version } |
            ConvertTo-Json |
            Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: Mditoor-Setup-[version]-Windows-[arch][ext]

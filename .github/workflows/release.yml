name: Release app

# Cut a release locally with `pnpm release patch|minor|major` (see scripts/release.mjs).
# That pushes a vX.Y.Z tag, which runs this workflow:
#   prepare -> build (Windows, macOS, Linux in parallel) -> publish
# Windows is the stable platform; macOS and Linux assets carry "alpha" in their names.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          # Full history and tags, needed to build the changelog since the previous tag.
          fetch-depth: 0

      - name: Validate tag against package.json
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$env:TAG' must look like vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre.N"
          }
          $version = $Matches.version
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $version) {
            throw "Tag $env:TAG does not match package.json version $pkgVersion. Use 'pnpm release' to bump both together."
          }
          $cargoVersion = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "Tag $env:TAG does not match src-tauri/Cargo.toml version $cargoVersion. Use 'pnpm release' to bump both together."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # Fail in seconds rather than after a full build that can't be signed.
      - name: Check signing secret is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"
            exit 1
          fi

      - name: Build changelog
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          log() { git log "$range" --no-merges --pretty='- %s (%h)' | grep -E "$1" | grep -v 'chore(release)' || true; }
          {
            printf '> **macOS and Linux builds are alpha.** They are built automatically but not regularly tested. '
            printf 'The macOS app is not notarized: if macOS says it is damaged, run `xattr -cr /Applications/Mditoor.app`. '
            printf 'Please [report issues](https://github.com/%s/issues).\n\n' "$GITHUB_REPOSITORY"
            features=$(log '^- feat')
            fixes=$(log '^- fix')
            other=$(git log "$range" --no-merges --pretty='- %s (%h)' | grep -vE '^- (feat|fix)' | grep -v 'chore(release)' || true)
            [ -n "$features" ] && printf '## Features\n%s\n\n' "$features"
            [ -n "$fixes" ] && printf '## Fixes\n%s\n\n' "$fixes"
            [ -n "$other" ] && printf '## Other changes\n%s\n\n' "$other"
            [ -n "$prev" ] && echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # Created as a draft so users (and the in-app updater, which reads
      # releases/latest) never see a release whose installers aren't uploaded yet.
      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running the workflow reuses the existing draft instead of failing.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            # Take the id from the create response: the releases list is eventually
            # consistent and may not include a just-created draft yet.
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Mditoor $GITHUB_REF_NAME" \
              -F body=@RELEASE_NOTES.md \
              -F draft=true \
              -F prerelease=${{ steps.version.outputs.prerelease }} \
              --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not create or find a release for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      # Let the other platforms finish so a re-run only has to redo the failed one.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            assets: Mditoor-Setup-[version]-Windows-[arch][ext]
          # One universal binary covers both Intel and Apple Silicon Macs.
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            assets: Mditoor-[version]-macOS-alpha-[arch][ext]
          # The oldest supported Ubuntu, so the binary links against an older glibc
          # and runs on more distros.
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            assets: Mditoor-[version]-Linux-alpha-[arch][ext]

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Check Tauri npm/Rust versions match
        run: node scripts/check-tauri-versions.mjs

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          # --locked fails if Cargo.lock is out of date with Cargo.toml.
          args: ${{ matrix.args }} -- --locked
          releaseAssetNamePattern: ${{ matrix.assets }}
          # The publish job writes latest.json once every platform has uploaded;
          # parallel jobs each merging into it could overwrite one another.
          uploadUpdaterJson: false

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The in-app updater polls releases/latest/download/latest.json. Each updater
      # bundle has a .sig next to it; map them to the updater's platform keys.
      - name: Write latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")
          platforms='{}'
          while IFS=$'\t' read -r asset_id name; do
            bundle=${name%.sig}
            case "$bundle" in
              *.exe)        keys='windows-x86_64 windows-x86_64-nsis' ;;
              *.app.tar.gz) keys='darwin-x86_64 darwin-aarch64 darwin-x86_64-app darwin-aarch64-app' ;;
              *.AppImage)   keys='linux-x86_64 linux-x86_64-appimage' ;;
              *.deb)        keys='linux-x86_64-deb' ;;
              *) continue ;;
            esac
            sig=$(gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}")
            # Draft assets have "untagged-..." download URLs; this is the URL once published.
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${bundle}"
            for key in $keys; do
              platforms=$(jq --arg k "$key" --arg s "$sig" --arg u "$url" '. + {($k): {signature: $s, url: $u}}' <<< "$platforms")
            done
          done < <(jq -r '.assets[] | select(.name | endswith(".sig")) | "\(.id)\t\(.name)"' <<< "$release")

          for key in windows-x86_64 darwin-aarch64 linux-x86_64; do
            if ! jq -e --arg k "$key" 'has($k)' <<< "$platforms" > /dev/null; then
              echo "::error::No signed updater bundle found for $key"
              exit 1
            fi
          done

          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "$(jq -r '.body // ""' <<< "$release")" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json

          # Re-runs replace the previous latest.json.
          old=$(jq -r '.assets[] | select(.name == "latest.json") | .id' <<< "$release")
          [ -n "$old" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old}"
          upload_url=$(jq -r '.upload_url' <<< "$release" | sed 's/{.*}//')
          gh api -X POST "${upload_url}?name=latest.json" \
            -H 'Content-Type: application/json' --input latest.json > /dev/null

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=true > /dev/null
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true > /dev/null
          fi
